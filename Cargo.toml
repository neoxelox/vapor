[workspace]
members = [
  "core/cli",
  "core/daemon",
  "core/ipc",
  "core/lifecycle",
  "core/platform",
  "core/providers",
  "core/shared",
  "tools/e2e",
  "tools/soak",
  "tools/vm",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
# No crate here goes to crates.io: Vapor ships as binaries.
publish = false
version = "0.2.0-alpha.3"

# Shared external dependencies are pinned once here and inherited via
# `{ workspace = true }` in each member crate, so a version bump lands in
# one place instead of being hand-duplicated across every manifest (a
# missed copy would break workspace resolution with conflicting `=` pins).
[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tempfile = "=3.27.0"
notify = "=8.2.0"
md-5 = "=0.10.6"
sha2 = "=0.10.9"
unicode-normalization = "=0.1.25"
rusqlite = "=0.42.0"
proptest = "=1.11.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
incremental = false
# Unwinding, not abort: the daemon catches a panic in one profile's tick
# or in one provider job and suspends that profile. With abort the same
# panic ends the daemon for every profile, and a panic that repeats on
# one file ends in a crash loop.
panic = "unwind"
strip = "symbols"
