[workspace]
members = [
  "core/cli",
  "core/daemon",
  "core/ipc",
  "core/lifecycle",
  "core/platform",
  "core/providers",
  "core/shared",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
version = "0.2.0-alpha.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
incremental = false
panic = "abort"
strip = "symbols"
