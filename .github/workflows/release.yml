name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: macos-latest
    timeout-minutes: 10
    outputs:
      tag_name: ${{ steps.release_meta.outputs.tag_name }}
      release_version: ${{ steps.release_meta.outputs.release_version }}
      release_stable: ${{ steps.release_meta.outputs.release_stable }}
      release_prerelease: ${{ steps.release_meta.outputs.release_prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release ref
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          if [[ "$REF_TYPE" != "tag" ]]; then
            echo "[release] expected a tag ref but got type '$REF_TYPE'"
            exit 1
          fi

          if [[ ! "$REF" =~ ^refs/tags/v ]]; then
            echo "[release] unsupported ref '$REF_NAME'; expected refs/tags/v*"
            exit 1
          fi

      - name: Derive release metadata
        id: release_meta
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

          if [[ "$TAG_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "release_version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "release_stable=true" >> "$GITHUB_OUTPUT"
            echo "release_prerelease=false" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-(rc|beta|alpha)\.([0-9]+)$ ]]; then
            echo "release_version=${BASH_REMATCH[1]}-${BASH_REMATCH[2]}.${BASH_REMATCH[3]}" >> "$GITHUB_OUTPUT"
            echo "release_stable=false" >> "$GITHUB_OUTPUT"
            echo "release_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "[release] unsupported tag format: $TAG_NAME"
            echo "[release] allowed: vX.Y.Z, vX.Y.Z-rc.N, vX.Y.Z-beta.N, vX.Y.Z-alpha.N"
            exit 1
          fi

      - name: Verify tag commit is on main
        run: |
          set -euo pipefail

          git fetch origin main --depth=1

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "[release] tag commit must be reachable from origin/main"
            exit 1
          fi

  lint:
    needs: preflight
    uses: ./.github/workflows/lint.yml

  test:
    needs: preflight
    uses: ./.github/workflows/test.yml

  perf:
    needs: preflight
    uses: ./.github/workflows/perf.yml

  release:
    needs: [preflight, lint, test, perf]
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ needs.preflight.outputs.tag_name }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.release_version }}
      RELEASE_STABLE: ${{ needs.preflight.outputs.release_stable }}
      RELEASE_PRERELEASE: ${{ needs.preflight.outputs.release_prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: latest-stable

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.9.0
        with:
          cache: false

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v5
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Validate signing and notarization configuration
        id: signing_config
        env:
          RELEASE_STABLE: ${{ needs.preflight.outputs.release_stable }}
          VAPOR_SIGN_IDENTITY: ${{ secrets.VAPOR_SIGN_IDENTITY }}
          VAPOR_NOTARY_PROFILE: ${{ secrets.VAPOR_NOTARY_PROFILE }}
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail

          signing_configured=false
          if [[ -n "$VAPOR_SIGN_IDENTITY" || -n "$VAPOR_NOTARY_PROFILE" || -n "$APPLE_DEVELOPER_ID_P12_BASE64" || -n "$APPLE_DEVELOPER_ID_P12_PASSWORD" || -n "$APPLE_KEYCHAIN_PASSWORD" || -n "$APPLE_NOTARY_API_KEY_P8_BASE64" || -n "$APPLE_NOTARY_KEY_ID" || -n "$APPLE_NOTARY_ISSUER_ID" ]]; then
            signing_configured=true
          fi

          if [[ "$signing_configured" == "true" ]]; then
            missing=()
            for required_var in VAPOR_SIGN_IDENTITY VAPOR_NOTARY_PROFILE APPLE_DEVELOPER_ID_P12_BASE64 APPLE_DEVELOPER_ID_P12_PASSWORD APPLE_KEYCHAIN_PASSWORD APPLE_NOTARY_API_KEY_P8_BASE64 APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID; do
              if [[ -z "${!required_var}" ]]; then
                missing+=("$required_var")
              fi
            done

            if (( ${#missing[@]} > 0 )); then
              echo "[release] signing/notarization configuration is incomplete: ${missing[*]}"
              exit 1
            fi
          fi

          if [[ "$RELEASE_STABLE" == "true" && "$signing_configured" != "true" ]]; then
            echo "[release] stable release requires signing identity, notarization profile, Developer ID certificate, and notary API credentials"
            exit 1
          fi

          echo "enabled=$signing_configured" >> "$GITHUB_OUTPUT"

      - name: Install signing certificate and notarization profile
        if: steps.signing_config.outputs.enabled == 'true'
        env:
          VAPOR_NOTARY_PROFILE: ${{ secrets.VAPOR_NOTARY_PROFILE }}
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/vapor-release.keychain-db"
          CERT_PATH="$RUNNER_TEMP/vapor-developer-id.p12"
          NOTARY_KEY_PATH="$RUNNER_TEMP/vapor-notary-api-key.p8"
          export CERT_PATH NOTARY_KEY_PATH APPLE_DEVELOPER_ID_P12_BASE64 APPLE_NOTARY_API_KEY_P8_BASE64

          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["CERT_PATH"]).write_bytes(base64.b64decode(os.environ["APPLE_DEVELOPER_ID_P12_BASE64"]))
          Path(os.environ["NOTARY_KEY_PATH"]).write_bytes(base64.b64decode(os.environ["APPLE_NOTARY_API_KEY_P8_BASE64"]))
          PY

          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CURRENT_KEYCHAINS=$(security list-keychains -d user | tr -d '"')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $CURRENT_KEYCHAINS
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          xcrun notarytool store-credentials "$VAPOR_NOTARY_PROFILE" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --keychain "$KEYCHAIN_PATH"

          echo "VAPOR_RELEASE_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "VAPOR_RELEASE_CERT_PATH=$CERT_PATH" >> "$GITHUB_ENV"
          echo "VAPOR_RELEASE_NOTARY_KEY_PATH=$NOTARY_KEY_PATH" >> "$GITHUB_ENV"

      - name: Validate changelog section matches tag
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ['RELEASE_VERSION']
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          matches = re.findall(r"^## \[([^\]]+)\]", changelog, flags=re.MULTILINE)
          if not matches:
            raise SystemExit('[release] CHANGELOG.md has no version headers')

          first_version = matches[0]
          if first_version != 'Unreleased':
            raise SystemExit('[release] first changelog section must be [Unreleased]')

          if version not in matches:
            raise SystemExit(f'[release] CHANGELOG.md missing section for [{version}]')
          PY
        shell: bash

      - name: Build package artifacts
        env:
          VAPOR_SIGN_IDENTITY: ${{ secrets.VAPOR_SIGN_IDENTITY }}
          VAPOR_NOTARY_PROFILE: ${{ secrets.VAPOR_NOTARY_PROFILE }}
          VAPOR_ENTITLEMENTS: ${{ vars.VAPOR_ENTITLEMENTS }}
          VAPOR_BUILD_NUMBER: ${{ vars.VAPOR_BUILD_NUMBER }}
        run: ./scripts/build.sh package

      - name: Validate packaged outputs
        run: |
          set -euo pipefail

          test -d dist/Vapor.app
          test -f dist/Vapor.zip
          test -x dist/Vapor.app/Contents/MacOS/Vapor
          test -x dist/Vapor.app/Contents/MacOS/vapord

      - name: Generate checksums
        run: |
          set -euo pipefail
          shasum -a 256 dist/Vapor.zip > dist/Checksums.txt

      - name: Extract release notes from changelog
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ['RELEASE_VERSION']
          text = Path('CHANGELOG.md').read_text(encoding='utf-8')
          pattern = re.compile(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(text)
          if not match:
            raise SystemExit(f'[release] could not extract changelog notes for [{version}]')

          body = match.group(1).strip()
          note = f"## Release {version}\n\n{body}\n"
          Path('dist/release-notes.md').write_text(note, encoding='utf-8')
          PY

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          prerelease_flag=()
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            prerelease_flag=(--prerelease)
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --draft \
              "${prerelease_flag[@]}" \
              --notes-file dist/release-notes.md
          else
            gh release create "$TAG_NAME" \
              --verify-tag \
              --draft \
              "${prerelease_flag[@]}" \
              --title "$TAG_NAME" \
              --notes-file dist/release-notes.md
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          assets=(dist/Vapor.zip dist/Checksums.txt)
          gh release upload "$TAG_NAME" "${assets[@]}" --clobber

      - name: Clean up signing material
        if: ${{ always() && steps.signing_config.outputs.enabled == 'true' }}
        run: |
          set -euo pipefail

          rm -f "${VAPOR_RELEASE_CERT_PATH:-}" "${VAPOR_RELEASE_NOTARY_KEY_PATH:-}"

          if [[ -n "${VAPOR_RELEASE_KEYCHAIN_PATH:-}" && -f "${VAPOR_RELEASE_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$VAPOR_RELEASE_KEYCHAIN_PATH" || rm -f "$VAPOR_RELEASE_KEYCHAIN_PATH"
          fi
