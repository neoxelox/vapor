name: build

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Cancel superseded PR runs (a stale matrix keeps burning macOS
# runners); never cancel main pushes or release-invoked (tag) runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        # macOS runs the full build (Rust + Swift). Linux and Windows
        # exercise core/* portability for the Rust workspace only; the Swift
        # wrapper scripts skip themselves on non-Darwin hosts. Per Wave 2 of
        # docs/tasks/README.md.
        include:
          - os: macos-26
            scope: full
          - os: ubuntu-latest
            scope: rust-only
          - os: windows-latest
            scope: rust-only

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Select Xcode
        if: matrix.scope == 'full'
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: latest-stable

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@1fbea72663f6d4c03efaab13560c8a24cfd2a7cc # v1.9.0
        with:
          cache: false

      - name: Cache Rust dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ github.workflow }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.workflow }}-

      - name: Cache SwiftPM dependencies
        if: matrix.scope == 'full'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: apps/macos/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run build
        shell: bash
        run: ./scripts/build.sh
