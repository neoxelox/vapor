name: build

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Inside a reusable-workflow call the `github` context is the caller's,
# so the group carries this workflow's own name to stay distinct from the
# caller's group, and runs on `main` or on a release tag are never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        # macOS runs the full build (Rust + Swift). Linux and Windows
        # exercise core/* portability for the Rust workspace only; the Swift
        # wrapper scripts skip themselves on non-Darwin hosts.
        include:
          - os: macos-latest
            scope: full
          - os: ubuntu-latest
            scope: rust-only
          - os: windows-latest
            scope: rust-only

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge of the pull request and its two parents:
          # scripts/scope.sh reads the changed files from them.
          fetch-depth: 2

      # A job runs only what the change touches (scripts/scope.sh). It
      # always starts and reports, because the ruleset of main requires
      # this check by name; with nothing to run it passes in seconds.
      - name: Decide what this job runs
        id: scope
        shell: bash
        env:
          VAPOR_SCOPE_BEFORE: ${{ github.event.before }}
        run: ./scripts/scope.sh build "${{ matrix.os }}" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        if: steps.scope.outputs.mode == 'full' && matrix.scope == 'full'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Set up Rust toolchain
        if: steps.scope.outputs.mode == 'full'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - name: Cache Rust dependencies
        if: steps.scope.outputs.mode == 'full'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Cache SwiftPM dependencies
        if: steps.scope.outputs.mode == 'full' && matrix.scope == 'full'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: apps/macos/.build
          key: ${{ runner.os }}-spm-build-${{ hashFiles('apps/macos/Package.swift') }}

      - name: Run build
        if: steps.scope.outputs.mode == 'full'
        shell: bash
        run: ./scripts/build.sh

      # The installer is what a Mac user downloads. It is built from
      # the binaries of the step above, unsigned, and installed on this
      # runner, so a break in the packaging shows at the pull request
      # and not at a release, after an hour of gates.
      - name: Build the installer (macOS)
        if: steps.scope.outputs.mode == 'full' && matrix.scope == 'full'
        shell: bash
        run: ./scripts/build.sh package

      - name: Install it and check the CLI on the PATH (macOS)
        if: steps.scope.outputs.mode == 'full' && matrix.scope == 'full'
        shell: bash
        run: apps/macos/scripts/verify-package.sh --install
