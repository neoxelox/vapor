name: lint

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  # The version of cargo-deny that `scripts/lint.sh` runs. It is part
  # of the Rust cache key: the cache holds the built binary.
  CARGO_DENY_VERSION: 0.20.2

# Inside a reusable-workflow call the `github` context is the caller's,
# so the group carries this workflow's own name to stay distinct from the
# caller's group, and runs on `main` or on a release tag are never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    name: lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # macOS runs the full lint pipeline (Rust + Swift). Linux and Windows
        # exercise core/* portability for the Rust workspace only; the Swift
        # wrapper scripts skip themselves on non-Darwin hosts.
        include:
          - os: macos-latest
            scope: full
          - os: ubuntu-latest
            scope: rust-only
          - os: windows-latest
            scope: rust-only

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        if: matrix.scope == 'full'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: clippy,rustfmt
          cache: false

      - name: Cache Rust dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-lint-deny${{ env.CARGO_DENY_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-deny${{ env.CARGO_DENY_VERSION }}-

      - name: Cache SwiftPM dependencies
        if: matrix.scope == 'full'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: apps/macos/.build
          key: ${{ runner.os }}-spm-lint-${{ hashFiles('apps/macos/Package.swift') }}

      # A cargo subcommand built from crates.io, not an action. The
      # binary lands in ~/.cargo/bin, which the Rust cache above keeps.
      - name: Install cargo-deny
        shell: bash
        run: |
          set -euo pipefail

          if ! cargo deny --version 2>/dev/null | grep -Fq "$CARGO_DENY_VERSION"; then
            cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"
          fi

      - name: Run lint checks
        shell: bash
        run: ./scripts/lint.sh
