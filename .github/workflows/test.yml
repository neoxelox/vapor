name: test

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Inside a reusable-workflow call the `github` context is the caller's,
# so the group carries this workflow's own name to stay distinct from the
# caller's group, and runs on `main` or on a release tag are never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        # macOS runs the full Tier 1 suite (Rust + Swift). Linux and Windows
        # exercise core/* portability for the Rust workspace only; the Swift
        # wrapper scripts skip themselves on non-Darwin hosts.
        include:
          - os: macos-latest
            scope: full
          - os: ubuntu-latest
            scope: rust-only
          - os: windows-latest
            scope: rust-only

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        if: matrix.scope == 'full'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - name: Cache Rust dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ github.workflow }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.workflow }}-

      - name: Cache SwiftPM dependencies
        if: matrix.scope == 'full'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: apps/macos/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run tests
        shell: bash
        env:
          VAPOR_TEST_MAX_SECONDS: "300"
        run: ./scripts/test.sh

      # Tier E2E: black-box run of the real vapor + vapord binaries in a
      # sandbox under the repo-local .vapor/e2e/, on every runner. The
      # harness skips (and names) every scenario whose need the host
      # cannot meet: Linux runs the daemon scenarios on inotify and
      # skips the launchd and disk-image ones; on Windows the daemon
      # scenarios skip until its native fs-watch ships. macOS adds
      # --full, the service lifecycle round-trip against the real
      # launchd: it installs a real LaunchAgent, so that phase is meant
      # for disposable runners like this one; contributors run plain
      # ./scripts/e2e.sh locally. See docs/development/e2e-verification.md.
      - name: Run e2e verification
        shell: bash
        run: |
          if [[ "${{ matrix.scope }}" == "full" ]]; then
            ./scripts/e2e.sh --full
          else
            ./scripts/e2e.sh
          fi

      - name: Upload e2e report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-report-${{ matrix.os }}
          path: .vapor/e2e/**/*result.json
          if-no-files-found: ignore
