name: test

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        # macOS runs the full Tier 1 suite (Rust + Swift). Linux and Windows
        # exercise core/* portability for the Rust workspace only; the Swift
        # wrapper scripts skip themselves on non-Darwin hosts. Per Wave 2 of
        # docs/tasks/README.md.
        include:
          - os: macos-26
            scope: full
          - os: ubuntu-latest
            scope: rust-only
          - os: windows-latest
            scope: rust-only

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        if: matrix.scope == 'full'
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: latest-stable

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.9.0
        with:
          cache: false

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache SwiftPM dependencies
        if: matrix.scope == 'full'
        uses: actions/cache@v5
        with:
          path: apps/macos/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run tests
        shell: bash
        run: ./scripts/test.sh

      # Tier E2E: black-box run of the real vapor + vapord binaries in a
      # sandbox under the repo-local .vapor/e2e/. macOS only — it drives
      # the native FSEvents watcher, and macOS is the shipping surface.
      # See docs/development/e2e-verification.md.
      - name: Run e2e verification
        if: matrix.scope == 'full'
        shell: bash
        run: ./scripts/e2e.sh
