version: 2
updates:
  # Keep GitHub Actions pins fresh. Every action is pinned to a full
  # commit SHA (with a `# vX.Y` comment) so a mutable tag cannot be
  # force-moved into the secret-bearing release job (AGENTS.md §7.1);
  # Dependabot bumps both the SHA and the comment when a new release ships.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
