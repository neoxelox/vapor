[package]
name = "vapor-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
globset = "=0.4.18"
md-5 = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
vapor-ipc = { path = "../ipc" }
vapor-platform = { path = "../platform" }
vapor-providers = { path = "../providers" }
vapor-shared = { path = "../shared" }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }

# Windows has no system `sqlite3.lib` to link against (macOS and Linux ship
# one), so on Windows build SQLite from source via rusqlite's `bundled`
# feature. With `resolver = "2"` this stays scoped to Windows targets, so the
# macOS/Linux builds keep linking the native system library unchanged. This
# keeps the Windows portability-guard CI leg green; revisit when the Windows
# surface actually ships.
[target.'cfg(windows)'.dependencies]
rusqlite = { workspace = true, features = ["bundled"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "vapord"
path = "src/main.rs"
