[package]
name = "vapor-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
globset = "=0.4.18"
libc = "=0.2.183"
notify = "=8.2.0"
rusqlite = "=0.38.0"
vapor-providers = { path = "../providers" }
vapor-shared = { path = "../shared" }

[dev-dependencies]
tempfile = "=3.27.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "vapord"
path = "src/main.rs"
