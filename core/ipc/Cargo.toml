[package]
name = "vapor-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
vapor-shared = { path = "../shared" }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.183"

[dev-dependencies]
tempfile = "=3.27.0"

[lib]
path = "src/lib.rs"
