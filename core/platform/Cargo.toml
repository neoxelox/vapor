[package]
name = "vapor-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
notify = { workspace = true }
vapor-shared = { path = "../shared" }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.183"
signal-hook = "=0.3.18"
xattr = "=1.6.1"

# Keychain Services (SecItem*) plus the CoreFoundation containers its
# dictionaries are built from. `security-framework-sys` exposes the raw
# symbols only; the store keeps the FFI surface to the handful of calls
# it needs instead of pulling the high-level crate.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
security-framework-sys = "=2.17.0"

[dev-dependencies]
tempfile = { workspace = true }

[lib]
path = "src/lib.rs"
