[package]
name = "vapor-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Development tool, never shipped: drives the real `vapor` + `vapord`
# binaries black-box inside a disposable sandbox. Lives in the workspace
# so format, lint, and test cover it like any other crate.

[dependencies]
clap = { version = "=4.5.50", features = ["derive"] }
globset = "=0.4.18"
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
vapor-ipc = { path = "../../core/ipc" }
vapor-shared = { path = "../../core/shared" }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.183"

# Same reason as core/daemon: Windows has no system sqlite3 to link.
[target.'cfg(windows)'.dependencies]
rusqlite = { workspace = true, features = ["bundled"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "vapor-e2e"
path = "src/main.rs"
